<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Оплата · Абонемент Плюс</title><style>body{margin:0;background:#f3f6f2;color:#17271e;font:17px/1.5 system-ui,sans-serif}main{max-width:430px;margin:8vh auto;padding:28px;background:white;border-radius:20px}h1{font-size:24px}label,input,button{display:block;box-sizing:border-box;width:100%}input{font:inherit;padding:13px;margin:8px 0 20px;border:1px solid #b8c7bf;border-radius:10px}button{font:inherit;padding:14px;border:0;border-radius:10px;background:#198b58;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.muted{color:#61766b;font-size:14px}#error{color:#bd283b;white-space:pre-wrap}@media(max-width:500px){main{margin:16px;padding:22px}}</style><script src="/payment.js" defer></script></head><body><main><h1>Оплата занятий</h1><p id="amount">Проверяем ссылку…</p><form id="payment-form" hidden><label for="email">Email для чека</label><input type="email" id="email" name="email" maxlength="254" required autocomplete="off" placeholder="name@example.ru"><p class="muted">Укажите адрес, на который нужно отправить фискальный чек</p><button id="continue" type="submit">Перейти к оплате</button><p class="muted" id="ready" hidden>Повторный переход откроет тот же счёт с email, указанным при его создании</p></form><p id="error" role="alert"></p></main></body></html>
